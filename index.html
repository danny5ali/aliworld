<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>play.dannyali.com</title>
  <meta name="description" content="ALIWORLD. a place that remembers.">

  <!-- open graph for shares -->
  <meta property="og:title" content="ALIWORLD">
  <meta property="og:description" content="a place that remembers.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://play.dannyali.com">

  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header class="brand">
      <div class="sigil" aria-hidden="true">
        <!-- cult.18 triangle sigil, inline SVG so it loads instantly -->
        <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 4 L36 32 L4 32 Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M14 32 L26 32" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <h1>play.dannyali.com</h1>
      <p class="tagline">choose your way in.</p>
    </header>

    <div class="chooser" role="navigation" aria-label="game selection">
      <a href="/blnt" class="card card-blnt" data-game="blnt">
        <div class="card-thumb">
          <span class="card-label">BLNT</span>
        </div>
        <div class="card-body">
          <h2>BETTER LUCK NEXT TIME</h2>
          <p>the album rollout game. 6 gyms. one rapper.</p>
          <span class="card-cta">play →</span>
        </div>
      </a>

      <a href="/aliworld" class="card card-aliworld" data-game="aliworld">
        <div class="card-thumb">
          <span class="card-label">ALIWORLD</span>
        </div>
        <div class="card-body">
          <h2>ALIWORLD</h2>
          <p>a place that remembers. you've been here before.</p>
          <span class="card-cta">step in →</span>
        </div>
      </a>
    </div>

    <footer>
      <p>six5ive · 2026</p>
    </footer>
  </main>

  <script src="router.js"></script>
</body>
</html>
