<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>ALIWORLD</title>
  <meta name="description" content="ALIWORLD. a place that remembers.">
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100vh;
      background: #0a0a0a;
      color: #ebe2d2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      min-height: 100vh;
      min-height: 100dvh;
    }
    main {
      text-align: center;
      max-width: 500px;
    }
    .sigil {
      width: 64px;
      height: 64px;
      color: #b32a1f;
      margin: 0 auto 2rem;
    }
    .sigil svg { width: 100%; height: 100%; }
    h1 {
      font-size: 2rem;
      letter-spacing: 0.1em;
      color: #b32a1f;
      margin-bottom: 1rem;
    }
    p {
      color: #8c8478;
      font-style: italic;
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .status {
      font-size: 0.875rem;
      color: #6a1612;
      letter-spacing: 0.1em;
      text-transform: lowercase;
    }
    a {
      color: #b32a1f;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      padding-bottom: 1px;
    }
  </style>
</head>
<body>
  <main>
    <div class="sigil" aria-hidden="true">
      <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 4 L36 32 L4 32 Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M14 32 L26 32" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>ALIWORLD</h1>
    <p>"a place that remembers."</p>
    <p class="status">— coming soon —</p>
    <p style="margin-top: 3rem;"><a href="/">← back to choose</a></p>
  </main>
</body>
</html>
